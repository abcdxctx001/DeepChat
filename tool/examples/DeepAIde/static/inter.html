<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交互模式 - DeepCoder</title>
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: hidden; display: flex; flex-direction: column; height: 100%; }
  #inter-head {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  #inter-head .title { font-weight: 700; }
  #inter-status { color: var(--fg-dim); }
  #inter-out {
    flex: 1;
    margin: 8px;
    overflow-y: auto;
    font-family: Consolas, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #inter-bar {
    display: flex;
    gap: 6px;
    padding: 0 8px 8px;
  }
  #inter-input {
    flex: 1;
    background: var(--bg3);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 8px;
    font-family: Consolas, monospace;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div id="inter-head">
    <span class="title">交互模式</span>
    <span id="inter-status">连接中…</span>
  </div>
  <div id="inter-out"></div>
  <div id="inter-bar">
    <input id="inter-input" placeholder="输入内容，回车发送给程序">
    <button id="inter-send" class="btn primary">发送</button>
    <button id="inter-kill" class="btn">结束进程</button>
  </div>
  <script src="inter.js"></script>
</body>
</html>
