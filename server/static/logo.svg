<svg height="1em" style="flex:none;line-height:1" viewBox="0 0 24 24" width="1em" xmlns="http://www.w3.org/2000/svg">
  <title>DeepChat</title>
  <!-- 纯色底 -->
  <rect x="0" y="0" width="24" height="24" rx="5.6" fill="#4F46E5"/>
  <!-- 操作模式：终端窗口（>_ 为负形） -->
  <rect x="5.2" y="5.2" width="13.1" height="8.9" rx="1.7" fill="#ffffff"/>
  <path d="M7.8 7.5 L9.7 9.2 L7.8 10.9" fill="none" stroke="#4F46E5" stroke-width="1.25"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="10.5" y="9.75" width="2.7" height="1.05" rx="0.5" fill="#4F46E5"/>
  <!-- 对话模式：气泡（描边用底色，跟窗口留缝） -->
  <path d="M13.9 12.3 h4.9 a1.7 1.7 0 0 1 1.7 1.7 v3.2 a1.7 1.7 0 0 1 -1.7 1.7 h-4.9
           a1.7 1.7 0 0 1 -1.7 -1.7 v-3.2 a1.7 1.7 0 0 1 1.7 -1.7 z"
        fill="#ffffff" stroke="#4F46E5" stroke-width="0.85"/>
  <path d="M13.7 18.9 L15.3 18.9 L13.1 21.1 Z" fill="#ffffff" stroke="#4F46E5" stroke-width="0.85"/>
</svg>
